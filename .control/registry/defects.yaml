    fix: SPEC-24
    title: "Saving canvas changes fails to persist edits and elements snap back to initial coordinates due to sticky isHealingOnlyRef and destructive serializeCanvas overwrite"
    component: registry
    violates: [UC-14]
    root_cause: code
    source: "Dev environment manual QA (2026-09-11) § Catatan 2"
    summary: >
      isHealingOnlyRef.current set on mount was never reset on user interactions (drag, resize, text edit,
      style change). On save, serializeCanvas received isHealingSave: true and aggressively overwrote computedX,
      computedY, content, and style back to source.*. The server persisted the old data and on reload the canvas
      snapped elements back to their initial positions. Filed into SPEC-24 tickets 02 and 03.
