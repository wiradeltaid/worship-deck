# defects.yaml — SSOT for defects: ordinary bugs and hotfixes.
#
# BUG-1..BUG-16 filed 2026-09-08 from manual QA of the W11 Artifacts overhaul (DEC-008), recorded
# verbatim in .work/requirements/prompt-04..07-*.md. Each `source` line names the exact prompt-file
# section. Where code inspection already located the mechanism, `summary` names the file/lines so
# the eventual fix does not re-discover it; that is not the same as a formal `root_cause` (this
# method reserves that field for resolving a `[MISSING]` doc marker — corpus-guide.md — which none
# of these are). Several of these look like an existing feature failing silently rather than a
# missing one, and per this project's AGENTS.md policy a bug goes through `wdi-systematic-debugging`
# BEFORE any patch is written. BUG-17 was added the same day from a full-codebase sweep the owner
# requested when accepting DEC-009 through DEC-012 ("tegakkan ke semua coding yang lain, cek ulang")
# — not from the original manual QA pass.
#
# 2026-09-08, round 2: the owner ran a second manual QA pass over SPEC-12's shipped fixes (recorded
# verbatim in .work/requirements/prompt-08-artifacts-qa-followup-round2.md) and found several marked
# `fixed` did not actually hold — reopened below with `status: open` and a note on what SPEC-12
# delivered vs what is still broken (`fixed_in` is kept as history, it does not mean "still true").
# BUG-18..BUG-24 are new from that same pass, filed into SPEC-13.
