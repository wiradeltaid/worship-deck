    title: "\"Re-measure all\" throws `t._set is not a function` on any legacy template containing a shape or image element"
    component: registry
    violates: [UC-14]
    root_cause: code
    source: "Dev environment manual QA (2026-09-13), owner report: clicking admin.artifacts.remeasureAll on a legacy template throws `t._set is not a function`"
    summary: >
      Diagnosed via wdi-systematic-debugging, and independently reproduced (twice, by two separate passes).
      `healTemplate()` (`src/lib/registry/canvas-utils.ts:884`) adds every non-text element to the Fabric
      canvas as a bare object literal — `canvas.add({ ...common, type: element.type })` — instead of a real
      `fabric.Rect`/`fabric.Image`/`fabric.Object` instance. `fabric.Canvas`'s `_onObjectAdded`
      (`node_modules/fabric/dist/index.node.mjs:3192-3198`, fabric `6.6.1`) unconditionally calls
      `obj._set('canvas', this)` on every added object; a plain object has no `_set` method, so this throws the
      instant a re-measured template contains a shape or image element. **Correction to the first diagnosis:**
      this does NOT require a real browser — `import('fabric')` in plain Node (or `fabric/node`) reproduces the
      crash identically via `StaticCanvas`, in well under a second. **Trigger is narrower than "any template
      with a shape/image":** `isElementUnmeasured()` returns `false` for every non-text type, so a template of
      only shapes/images returns early and never reaches the crash; the trigger is an *unmeasured text element
      together with* at least one shape/image element in the same template.
      Introduced in SPEC-23-05 (`fe8b1f5`, "measurement coverage on open & heal with re-measure action") — not
      a SPEC-24 regression, only newly surfaced because no manual or automated test had exercised "Re-measure
      all" against such a template until now. `tests/smoke-spec-23.test.mjs` calls
      `healTemplate(legacyTemplate, {})` with `fabric: {}` and no `document` global, so every existing test
      takes the Node-headless fallback path for both the canvas (a hand-rolled object whose `add()` is a bare
      `Array.push`, never invoking `_onObjectAdded`/`_set`) and text elements — the real-Fabric path this bug
      lives in has zero test coverage.

      **A second, more serious defect at the same root cause, found during independent review and folded into
      this same row rather than opened separately (same file, same function, same fix ticket):**
      `healTemplate()`'s own text-element construction (`canvas-utils.ts` ~875) and its shape/image construction
      both omit style fields that `elementToFabricObject()` (`ArtifactEditor.tsx:149`, the construction path the
      interactive canvas already uses correctly) always supplies — `fill`/`opacity` for shapes,
      `fill`/`textAlign`/`lineHeight`/`underline`/`shadow` for text. Verified at runtime: healing a shape with no
      authored `fillColor` used to pass its `undefined` fill through untouched (plain object literal has no
      `fill` at all); constructing a real `fabric.Rect` instead — as a literal fix for the crash above, with no
      other change — defaults `fill` to `'rgb(0,0,0)'` and `opacity` to `1`, which `serializeCanvas`'s
      `toStrictHexColor` then writes back as `#000000`, repainting the shape black. Likewise, a real
      `fabric.Textbox` constructed without the missing options strips `fontColor`, resets `textAlign` to
      Fabric's own default, and drops `lineHeight`/`underline`/`textShadow` — verified against a realistic
      fixture (white, centred, underlined, shadowed text healed into black, left-aligned, plain text). Because
      `handleRemeasureAll` loops over and *saves* every template it changes, fixing the crash without also
      fixing this would turn "Re-measure all" into a library-wide style-and-colour wipe — exactly the class of
      damage SPEC-24 (BUG-32) already closed once, and exactly what the owner's own checklist wording
      ("elemen yang tidak diedit tidak boleh bergeser/berubah visual") already guards against. The crash today
      partially masks this by aborting the batch before most templates save. Filed into SPEC-25 (ticket 01,
      which must reuse/extract `elementToFabricObject`'s full construction rather than adding a second,
      partial one, to close both defects in the one fix).
  - id: BUG-34
    status: open
    fix: SPEC-26
    title: "Presenter/Projector output crops the slide differently than the Canvas editor for the same template"
    component: registry
    violates: [UC-14]
    root_cause: code
    source: "Dev environment manual QA (2026-09-13), owner screenshots: same \"Bandung international community\" fixture rendered inset with margin on all four edges in the Canvas (Fabric) editor, but scaled up and cropped (top of \"B\", bottom of \"y\", and the right edge all touch or clip the frame) in the live Presenter/Projector output. Residual confirmed on dev deploy after SPEC-25: visual framing disparity remains unresolved between Canvas and Presenter views."
    summary: >
      Reopened after SPEC-25, then re-diagnosed under SPEC-26 by direct measurement in Chromium against
      this working tree (runners in .work/spec-26-diagnostics/; numbers in sweep-report.txt).
      SPEC-25-03's container-query stage wrapper is NOT the residual defect: measured on the real
      /slideshow and /present/projector routes at 1600x900, 2560x1080, 1920x600, 1000x1000 and
      1080x1920, the stage holds a 1.7778 ratio everywhere, the letterbox/pillarbox bars are correct,
      no element box escapes the stage and no text box clips. The real defect is inside the stage:
      Fabric's Textbox and ArtifactSlide size and clip text by opposite rules. Textbox discards the
      constructor's height (fabric index.mjs:22960) and widens itself to dynamicMinWidth
      (index.mjs:22952-22954), so the Canvas paints text unbounded and unshrunk; ArtifactSlide applies
      the authored box, overflow:hidden and shrink-to-fit. Across the 32 shipped canvas templates
      (64 elements) this yields 20 FIT, 20 OVERRUN, 11 CLIP, 7 WRAP and 2 GEOM divergences. The
      "Bandung international community" (welcome) layout the report cites is one of the CLEAN ones -
      measured mean channel difference between the two live surfaces is 7.15/255, which is screenshot
      rescaling noise; sermon, closing-prayer-ds, intercessory-671-lyric-1 and hope-lyric-1 are the
      templates that actually exhibit it. Before attributing any remaining symptom on
      presenter-dev.bic.my.id to code, confirm that host serves a build containing SPEC-25-03.

  - id: BUG-35
    status: open
    fix: SPEC-26
    title: "Opening a template in the Canvas editor and pressing Save, with no edit, widens the stored element geometry"
    component: registry
    violates: [UC-14]
    root_cause: code
    source: "SPEC-26 second-opinion diagnosis (2026-09-13), measured end-to-end against the real API by .work/spec-26-diagnostics/run-save-roundtrip.mjs"
    summary: >
      Fabric's Textbox widens itself to `dynamicMinWidth` when the longest unbreakable run does not fit
      the authored width (fabric index.mjs:22952-22954), and `serializeCanvas` writes that computed width
      back as authored geometry (canvas-utils.ts:625-630, `isWidthResized ? pxToPct(measuredWidth, ...)`).
      An unsubstituted placeholder token is one such unbreakable run, so the box is permanently resized to
      fit text that is substituted away before the slide is ever projected. Measured: opening `sermon` in
      /admin/artifacts and pressing Save with no edit at all rewrites e1.w from 31.26 to 45.095105926513675
      (+44.3%). Found while diagnosing BUG-34 and filed separately because it is a distinct mechanism with
      its own guard: it corrupts stored data rather than only rendering it differently, and it drags authored
      geometry further from the Presenter's rendering on every save. `data.authoredWidth` / `authoredHeight`
      are already carried on every Fabric object (canvas-utils.ts:176, :234) and are the intended
      discriminator between a dimension the operator dragged and one Fabric computed. `applyWrapSlack`
      (SPEC-23-01) is a deliberate widening with a stated reason and is not this defect.
