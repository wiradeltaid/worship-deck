      note: "Terra (kiro-agent). Confirmed the core claim (getRemoteStream accepts a direct role=remote reconnect on hasPairedRemote+pairedRemoteUID==sess.UID, postRemoteClaim not involved) and found 6 real gaps in the naive fix: (1) EventSource.onerror exposes no HTTP status, so the client cannot tell a terminal 409 apart from a transient blip -- needs a bounded-retry-or-status-check fallback policy, not a bare retry-once; (2) no stream-generation/stale-callback guard -- a delayed onerror from a superseded EventSource can corrupt state set by a newer stream; (3) a real (not just theoretical) unpair-vs-reconnect race, including already-queued messages draining from a channel the unpair is concurrently closing; (4) page reload (a brand-new session instance) isn't covered by a runtime-only retry -- ticket must explicitly decide if that's in scope; (5) different-UID rejection and expired-auth handling need their own explicit tests, not folded into the happy path; (6) deleteRemotePair has no caller-authorization check at all (any signed-in user can end any service's pairing) -- out of scope for this ticket's fix, but flagged since it undermines the ticket's own 'presenting client explicitly unpaired' premise."
