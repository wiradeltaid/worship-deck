# components.yaml — SSOT for Product Component, container, and Logical Component
#
# Three different things, two of which share the word "component":
#   Product Component (PC) — a DOMAIN slice, a surface a user can name
#   Container              — a unit that runs or deploys on its own; C4 L2 owns it
#   Logical Component (LC) — one addressable unit of build
#
# Born 2026-08-18 from the brief + three area PRDs. Name = the surface a user can name.
# mode deep (2026-08-18, owner): complete as-built — ABCE, contracts, data dictionary, scenarios.
# Previously guarded. risk_accepted stays medium (not high).
# risk_accepted medium: Hub and Registry touch personal data (names, photos, prayers).
# Presenter displays PII but does not collect it — still medium because of verse overlay
# and the live channel; not high (needs a DEC-).
#
# Containers (DEC-003 / AD-30): Go API, React SPA, on-demand Node PPTX worker.
# Retired name `web` (Next.js one-process) is not a container.

product_components:
  - id: hub
    name: "Hub"
    mode: deep
    g4_passed: true
    risk_accepted: medium
    risk_note: "congregation personal data in the Service payload and announcement list; Operator accounts"
    owns:
      - Service
      - Account
      - AppSetting
      - SongSetInput
    srs: .what/hub/SRS-hub.md
    sdd: .how/hub/SDD-hub.md
    containers:
      - api
      - spa
      - pptx-worker

  - id: presenter
    name: "Presenter"
    mode: deep
    g4_passed: true
    risk_accepted: medium
    risk_note: "displays names and verses on the room screen; does not write the weekly payload"
    owns:
      - BibleTranslation
      - BibleBook
      - BibleVerse
      - BibleBookName
    srs: .what/presenter/SRS-presenter.md
    sdd: .how/presenter/SDD-presenter.md
    containers:
      - api
      - spa

  - id: registry
    name: "Registry"
    mode: deep
    g4_passed: true
    risk_accepted: medium
    risk_note: "Deck structure; deleting an entry is irreversible; not weekly content"
    owns:
      - ArtifactTemplate
      - ServiceRegistrySnapshot
      - AnnouncementSet
      - AnnouncementSetSlide
      - BackgroundImage
      - SongBook
      - SongSetLayout
      - ServiceSongSetLayout
      - SongSetEntry
    srs: .what/registry/SRS-registry.md
    sdd: .how/registry/SDD-registry.md
    containers:
      - api
      - spa

platform_owns: []

containers:
  - id: api
    name: "API (Go)"
    built: true
    note: "Always-on process. Owns SQLite, assembles the slide plan, serves JSON. Production also serves SPA static files. DEC-003 / AD-30."
  - id: spa
    name: "SPA (React)"
    built: true
    note: "Operator UI and projector in the browser. MUST NOT open SQLite. Production files served by api; development MAY use a bundler. DEC-003 / AD-30."
  - id: pptx-worker
    name: "PPTX worker (Node / PptxGenJS)"
    built: true
    note: "On-demand child process. Draws a finished plan, then exits. MUST NOT stay up and MUST NOT open SQLite. DEC-003 / AD-30."

