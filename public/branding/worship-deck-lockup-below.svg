<svg xmlns="http://www.w3.org/2000/svg" width="760" height="600" viewBox="0 0 760 600" role="img" aria-label="WorshipDeck Lockup Below (Gold/Dark)">
  <title>WorshipDeck Lockup Below (Gold/Dark)</title>
  <defs>
    <style>
      .lk-bl-gd-text {
        font-family: 'Inter', 'Geist Sans', 'Segoe UI Variable', 'Segoe UI', system-ui, -apple-system, sans-serif;
        font-size: 104px;
        font-weight: 700;
        letter-spacing: -0.022em;
        fill: #0B0F14;
      }
    </style>
    <rect id="lk-bl-gd-card" x="158.2" y="240.1" width="308" height="173.25" rx="19" ry="19"
          fill="none" stroke="#B8860B" stroke-width="24" stroke-linejoin="round"/>
    <rect id="lk-bl-gd-mask" x="158.2" y="240.1" width="308" height="173.25" rx="19" ry="19"
          fill="black" stroke="black" stroke-width="25.5" stroke-linejoin="round"/>
    <mask id="lk-bl-gd-mb" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <rect width="512" height="512" fill="white"/>
      <use href="#lk-bl-gd-mask" transform="rotate(-22 158.2 413.3)"/>
      <use href="#lk-bl-gd-mask" transform="rotate(0 158.2 413.3)"/>
    </mask>
    <mask id="lk-bl-gd-mm" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <rect width="512" height="512" fill="white"/>
      <use href="#lk-bl-gd-mask" transform="rotate(0 158.2 413.3)"/>
    </mask>
    <clipPath id="lk-bl-gd-clip">
      <rect x="170.2" y="252.1" width="284.0" height="149.25" rx="13.0" ry="13.0"/>
    </clipPath>
  </defs>
  <!-- Mark Element -->
  <g transform="translate(155.16, 12.20) scale(0.8800)">
  <!-- 3 Fanned 16:9 Frames -->
  <g mask="url(#lk-bl-gd-mb)"><use href="#lk-bl-gd-card" transform="rotate(-44 158.2 413.3)"/></g>
  <g mask="url(#lk-bl-gd-mm)"><use href="#lk-bl-gd-card" transform="rotate(-22 158.2 413.3)"/></g>
  <use href="#lk-bl-gd-card" transform="rotate(0 158.2 413.3)"/>
  <!-- Screen Glass Glare (Arah B /) -->
  <g clip-path="url(#lk-bl-gd-clip)">
    <polygon points="345,252.1 403,252.1 283,401.35 225,401.35" fill="#B8860B" opacity="0.22"/>
    <polygon points="418,252.1 434,252.1 314,401.35 298,401.35" fill="#B8860B" opacity="0.14"/>
  </g>

  </g>

  <!-- Wordmark 'WorshipDeck' -->
  <text x="380.0" y="486.0" text-anchor="middle" class="lk-bl-gd-text">WorshipDeck</text>
</svg>
