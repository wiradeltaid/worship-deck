name: Node.js CI

on:
  workflow_dispatch:
  pull_request:
    types: [ready_for_review]
  push:
    branches: [ "main" ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Use Node.js 22
      uses: actions/setup-node@v7
      with:
        node-version: '22'
        cache: 'npm'

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24'

    - run: go test ./cmd/... ./internal/...

    - run: npm ci

    - run: npm run spa:build

    # `vite build` does not type-check, and `npm test` does not run tsc. Two defects
    # shipped on 2026-08-21 through that gap: `useT()` used as a function (white-screened
    # the admin page) and a call to an unimported helper swallowed by a try/catch, which
    # silently defaulted every backfilled song-book locale. This step closes it.
    - run: npm run typecheck

    # The browser acceptance suites need a Chromium binary; `npm ci` does not
    # fetch it. Without this the three suites fail at launch and, until the
    # harness was fixed, leaked a `go run` each and hung the runner.
    - run: npx playwright install --with-deps chromium

    - run: npm test
